data:
  city: beijing
  data_dir: /workspace/China_Journal/data
  obs_len: 12
  pred_len: 1
model:
  llm:
    model_name: Gemma-2-9B
    model_path: /datadisk
    max_new_tokens: 128
    temperature: 0.3
    top_p: 0.8
    top_k: 40
    do_sample: true
    use_quantization: true
    use_lora: true
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.05
  rag:
    top_m_samples: 3
    database_path: /workspace/China_Journal/util/rag_database
    max_summary_length: 256
  gravity:
    top_n_candidates: 5
    weight: 1.0
    radius: 5
    grid_size: 40
  prediction:
    top_k_predictions: 10
training:
  num_epochs: 3
  batch_size: 1
  samples_per_epoch: 500
  learning_rate: 5.0e-05
  weight_decay: 0.01
  optimizer: adamw
  max_grad_norm: 0.5
  gradient_accumulation_steps: 1
  use_scheduler: false
  scheduler_type: linear
  warmup_steps: 100
  val_every_n_epochs: 1
  save_every_n_epochs: 1
  early_stopping_patience: 5
  output_dir: /workspace/China_Journal/output
  checkpoint_dir: checkpoints
  log_dir: logs
  log_every_n_steps: 10
  verbose: false
validation:
  num_samples: 100
  batch_size: 1
  verbose: false
testing:
  num_samples: 100
  batch_size: 1
  detailed_log: true
  log_first_n_samples: 10
  save_predictions: true
  verbose: true
rag_build:
  batch_size: 32
  output_dir: /workspace/China_Journal/util/rag_database
  save_faiss_index: true
  overwrite: false
  verbose: true
detailed_debug:
  enabled: true
  num_samples: 20
  print_prompts: true
  print_rag_results: true
  print_gravity_candidates: true
  print_llm_responses: true
  save_debug_log: true
