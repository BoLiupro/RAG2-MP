# Configuration file for Mobility Prediction Training

random_seed: 42

# ============================================================================
# Data Configuration
# ============================================================================
data:
  # City and paths
  city: "beijing"  # City name: beijing, shenzhen, nanchang
  data_dir: "/workspace/China_Journal/data"  # Base data directory
  
  # Trajectory parameters
  obs_len: 12  # Observation trajectory length (number of historical locations)
  pred_len: 1  # Prediction trajectory length (typically 1 for next location)

# ============================================================================
# Model Configuration
# ============================================================================
model:
  # ---------------------------------------------------------------------------
  # LLM (Large Language Model) Configuration
  # ---------------------------------------------------------------------------
  llm:
    model_name: "Deepseek-R1-Distill-Qwen-3B"  # LLM model name
    model_path: "/datadisk"  # Base path where LLM models are stored
    
    # Generation parameters
    max_new_tokens: 256  # Maximum tokens to generate in LLM response
    temperature: 0.2  # Sampling temperature (higher = more random)
    top_p: 0.8  # Nucleus sampling parameter (cumulative probability)
    top_k: 40  # Top-k sampling parameter (number of top tokens to consider)
    do_sample: true  # Whether to use sampling (false for greedy decoding)
    
    # Model optimization
    use_quantization: true  # Use 4-bit quantization to save memory
    use_lora: true  # Use LoRA fine-tuning (set true for training)
    
    # LoRA parameters (only used if use_lora is true)
    lora_r: 8  # LoRA rank
    lora_alpha: 16  # LoRA alpha parameter
    lora_dropout: 0.05  # LoRA dropout rate
  
  # ---------------------------------------------------------------------------
  # RAG (Retrieval-Augmented Generation) Configuration
  # ---------------------------------------------------------------------------
  rag:
    top_m_samples: 10  # Number of similar historical samples to retrieve
    database_path: "/workspace/China_Journal/util/rag_database"  # RAG database directory
    max_summary_length: 256  # Maximum summary length in tokens
  
  # ---------------------------------------------------------------------------
  # Gravity Model Configuration
  # ---------------------------------------------------------------------------
  gravity:
    top_n_candidates: 3  # Number of top candidates per POI category
    weight: 1.0  # Default weight parameter (used if no weight_config_path or category-specific weights)
    radius: 10  # Search radius in grid units
    grid_size: 40  # Grid system size (40x40 = 1600 grids)
    weight_config_path: /workspace/China_Journal/util/gravity_weight/gravity_weights_${data.city}.json  # Path to fitted weights JSON file (optional, e.g., "/workspace/China_Journal/util/gravity_weight/gravity_weights_beijing.json")
    # If weight_config_path is provided and file exists, it will override the default weight parameter
    # Fitted weights can be generated using: bash scripts/fit_gravity_weights.sh --city beijing
  
  # ---------------------------------------------------------------------------
  # Prediction Configuration
  # ---------------------------------------------------------------------------
  prediction:
    top_k_predictions: 10  # Number of top location predictions to return
    time_interval: "1 hour"  # Time interval for next location prediction (e.g., "1 hour", "2 hours", "30 minutes")

# ============================================================================
# Training Configuration
# ============================================================================
training:
  # Basic training parameters
  num_epochs: 3  # Number of training epochs
  batch_size: 1  # Batch size (currently only supports 1 due to LLM constraints)
  # samples_per_epoch: None  # Samples to train per epoch (null for all training data)
  
  # Optimizer parameters
  learning_rate: 5.0e-5  # Learning rate for optimizer (reduced for stability)
  weight_decay: 0.01  # Weight decay (L2 regularization)
  optimizer: "adamw"  # Optimizer type: adamw, adam, sgd
  
  # Gradient control
  max_grad_norm: 0.5  # Maximum gradient norm for clipping (reduced for stability)
  gradient_accumulation_steps: 1  # Steps to accumulate gradients (simulates larger batch)
  
  # Learning rate schedule
  use_scheduler: false  # Whether to use learning rate scheduler
  scheduler_type: "linear"  # Scheduler type: linear, cosine, constant
  warmup_steps: 100  # Number of warmup steps for learning rate
  
  # Validation and checkpointing
  val_every_n_epochs: 1  # Validate every N epochs
  save_every_n_epochs: 1  # Save checkpoint every N epochs
  early_stopping_patience: 5  # Early stopping patience (0 to disable)
  
  # Output paths
  output_dir: "/workspace/China_Journal/output"  # Base output directory
  checkpoint_dir: "checkpoints"  # Checkpoint subdirectory
  log_dir: "logs"  # Log subdirectory
  
  # Logging
  log_every_n_steps: 10  # Log training metrics every N steps
  verbose: false  # Print detailed training information

# ============================================================================
# Validation Configuration
# ============================================================================
validation:
  # num_samples: 10000
  batch_size: 1  # Batch size for validation
  verbose: false  # Print detailed validation information

# ============================================================================
# Testing Configuration
# ============================================================================
testing:
  num_samples: 10000
  batch_size: 1  # Batch size for testing
  
  # Logging options
  detailed_log: true  # Whether to log detailed intermediate results
  log_first_n_samples: 10  # Number of samples to log in detail
  save_predictions: true  # Save all predictions to file
  verbose: true  # Print detailed testing information

# ============================================================================
# RAG Database Building Configuration
# ============================================================================
rag_build:
  batch_size: 32  # Batch size for encoding trajectory samples
  output_dir: "/workspace/China_Journal/util/rag_database"  # Output directory
  save_faiss_index: true  # Whether to save FAISS index
  overwrite: false  # Whether to overwrite existing database
  verbose: true  # Print progress information

# ============================================================================
# Detailed Debugging Configuration (for detailed_trainer.py)
# ============================================================================
detailed_debug:
  enabled: true  # Enable detailed debugging mode
  num_samples: 10000
  print_prompts: true  # Print all prompts sent to LLM
  print_rag_results: true  # Print RAG retrieval results
  print_gravity_candidates: true  # Print gravity model candidates
  print_llm_responses: true  # Print LLM responses
  save_debug_log: true  # Save detailed debug log to file
